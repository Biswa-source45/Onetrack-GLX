services:
  # Database container
  postgres:
    image: postgres:15-alpine
    container_name: onetrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onetrack
    ports:
      - "5433:5432" # Keeps host port 5433 mapped to allow manual DB tools access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # On a brand-new volume Postgres runs initdb and briefly stops/restarts
      # itself before accepting real connections — this makes Compose actually
      # wait for that to finish instead of just checking the container started.
      test: ["CMD-SHELL", "pg_isready -U postgres -d onetrack"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - onetrack-network

  # Redis Cache container
  redis:
    image: redis:7-alpine
    container_name: onetrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - onetrack-network

  # Go Backend microservice
  backend:
    image: ghcr.io/biswa-source45/onetrack-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onetrack-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - GIN_MODE=release
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=onetrack
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - onetrack-network

  # React Frontend container with built-in Nginx proxy
  frontend:
    image: ghcr.io/biswa-source45/onetrack-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: onetrack-frontend
    restart: unless-stopped
    ports:
      - "80:80" # Exposed on standard HTTP port 80 for easy local Wi-Fi access
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - onetrack-network

  # Database Management GUI (Adminer Web Tool)
  adminer:
    image: adminer:latest
    container_name: onetrack-adminer
    restart: unless-stopped
    ports:
      - "8080:8080" # Accessible via browser at http://<SERVER_IP>:8080
    depends_on:
      - postgres
    networks:
      - onetrack-network

  # Automated Auto-Update Service (Watchtower)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: onetrack-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=false
    networks:
      - onetrack-network

volumes:
  postgres_data:

networks:
  onetrack-network:
    driver: bridge
